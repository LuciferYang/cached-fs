name: Release to Maven Central

# Manual trigger so a failed/missing-secret run can never fire automatically on a tag push.
# Run this from the DEFAULT branch (main) and pass the tag to publish via the `ref` input — that way
# the latest workflow definition (with the environment wiring below) is always used, while the build
# checks out and publishes the exact tagged commit. Signing + Portal credentials come from the
# `Cached-FS` GitHub Environment. With autoPublish=false (see the release profile), the upload waits
# in https://central.sonatype.com for you to click "Publish".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag (or ref) to build and publish, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The four MAVEN_* secrets live in this Environment, not at repo level; the job must opt in to
    # read them.
    environment: Cached-FS
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21 + Maven settings + GPG
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes ~/.m2/settings.xml with a <server id=central> whose username/password read from
          # the named env vars below — matches <publishingServerId>central</publishingServerId>.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          # Imports the signing key into the runner's keyring; the passphrase env is read by
          # maven-gpg-plugin (loopback pinentry, configured in the release profile).
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy (sign + upload to Central Portal)
        # Tests already gate the tagged commit via ci.yml, so skip them here for a fast, deterministic
        # publish. Drop -DskipTests if you want the release build to re-run the suite.
        # -pl restricts the reactor to the five publishable library modules (+ parent via -am); the
        # benchmark module is left out entirely so it can never reach the Central bundle. (The central
        # plugin ignores maven.deploy.skip, and excludeArtifacts is only belt-and-suspenders.)
        run: >-
          mvn -B -ntp -Prelease -DskipTests
          -pl cached-fs-core,cached-fs-hadoop,cached-fs-metrics,cached-fs-spark,cached-fs-cli -am
          clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
