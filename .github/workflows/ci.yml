name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        jdk: ['21', '25']
    runs-on: ubuntu-latest
    name: build (jdk-${{ matrix.jdk }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
          cache: 'maven'
      - name: Build & test
        # Spotless / google-java-format is pinned at a JDK 21-compatible version; gate the check
        # to that one matrix entry so newer JDKs (25+) don't trip on parser internals.
        run: mvn -B -ntp verify -Dspotless.check.skip=${{ matrix.jdk != '21' }}
      - name: Upload coverage
        if: matrix.jdk == '21'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
