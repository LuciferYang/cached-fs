name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default Hadoop pin (3.4.1) is what production runs against.
          - jdk: '21'
            hadoop: '3.4.1'
            spark-profile: 'spark-4.0'
          # Spark 4.1 must also stay green — without this cell, the spark-4.1 profile would
          # rot silently between manual verifications and any API/binary regression introduced
          # by future PRs would only surface when someone re-tests locally.
          - jdk: '21'
            hadoop: '3.4.1'
            spark-profile: 'spark-4.1'
          # Locale cell: same stack as the spark-4.0 baseline but run under a comma-decimal
          # locale (de_DE). Catches locale-sensitive formatting regressions — e.g. a future
          # String.format("%.1f", x) without Locale.ROOT would render "120,0" here and fail any
          # test asserting "120.0". Forward-looking guard: current formatting already pins
          # Locale.ROOT, so this protects against NEW locale-dependent output rather than a
          # present bug. Runs in parallel (fail-fast: false), so it adds no wall-clock cost.
          - jdk: '21'
            hadoop: '3.4.1'
            spark-profile: 'spark-4.0'
            locale: 'de_DE'
          # Hadoop 3.5.x compatibility on the supported JDK. Production pins 3.4.1, but the
          # decorator does reflective rebuilds of S3ALocatedFileStatus / AbfsLocatedFileStatus /
          # EtagSource — internal Hadoop API that drifts across minors. This cell catches a
          # reflection/API break against the 3.5.x line (also the line a future JDK-25 cell needs).
          - jdk: '21'
            hadoop: '3.5.0'
            spark-profile: 'spark-4.0'
          # JDK 25 forward-compat — FS-agnostic modules only. The JDK-25 blocker is Hadoop UGI:
          # UserGroupInformation.getCurrentUser calls Subject.getSubject(AccessControlContext),
          # removed in JDK 24, and JDK 25 rejects the -Djava.security.manager=allow escape (JEP 486
          # finalized). That breaks EVERY module which opens a Hadoop FileSystem — cached-fs-hadoop
          # (HadoopReadFileTest), cached-fs-cli, cached-fs-bench, and Spark — not just Spark. Only
          # cached-fs-core and cached-fs-metrics are FS-agnostic and pass on 25, so this cell scopes
          # to them (guards the pure library against JDK-25 language/dependency regressions). Drop
          # the `modules` scope and re-add hadoop/cli/bench + a spark-4.2 cell once Hadoop ships the
          # Subject.current() migration (HADOOP-19212).
          - jdk: '25'
            hadoop: '3.5.0'
            spark-profile: 'spark-4.0'
            modules: 'cached-fs-core,cached-fs-metrics'
    runs-on: ubuntu-latest
    name: build (jdk-${{ matrix.jdk }} hadoop-${{ matrix.hadoop }} ${{ matrix.spark-profile }}${{ matrix.locale && format(' {0}', matrix.locale) || '' }}${{ matrix.modules && format(' [{0}]', matrix.modules) || '' }})
    # Pin the locale for every step (Maven + all forked test JVMs inherit it). The de_DE cell
    # exercises a comma-decimal locale; the others use C.UTF-8 for a deterministic baseline.
    env:
      LANG: ${{ matrix.locale == 'de_DE' && 'de_DE.UTF-8' || 'C.UTF-8' }}
      LC_ALL: ${{ matrix.locale == 'de_DE' && 'de_DE.UTF-8' || 'C.UTF-8' }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
          cache: 'maven'
      - name: Generate de_DE locale
        if: matrix.locale == 'de_DE'
        run: sudo locale-gen de_DE.UTF-8 && sudo update-locale
      - name: Confirm the JVM picked up the de_DE locale
        if: matrix.locale == 'de_DE'
        # Make the cell self-verifying: if LANG didn't actually flip the JVM default locale, the
        # cell would pass vacuously and give false coverage. Fail loudly instead.
        run: |
          props=$(java -XshowSettings:properties -version 2>&1 | grep -E 'user\.(language|country)' | tr -d ' ')
          echo "JVM locale: $props"
          echo "$props" | grep -q 'user.language=de' || { echo "::error::JVM not running under de locale"; exit 1; }
      - name: Build & test
        # Spotless / google-java-format is pinned at a JDK 21-compatible version; gate the check
        # to that one matrix entry so newer JDKs (25+) don't trip on parser internals.
        run: >-
          mvn -B -ntp verify
          ${{ matrix.modules && format('-pl {0} -am', matrix.modules) || '' }}
          -P${{ matrix.spark-profile }}
          -Dhadoop.version=${{ matrix.hadoop }}
          -Dspotless.check.skip=${{ matrix.jdk != '21' }}
      - name: Smoke-run the benchmark jar
        # `verify` already shaded cached-fs-bench/target/benchmarks.jar (shade runs in the package
        # phase), but nothing launches it — so runtime-only regressions escape: a broken shade
        # manifest, a dropped JMH BenchmarkList, the dnsjava InetAddressResolverProvider SPI fork
        # failure, or a JDK-fork mismatch (all of which we've hit by hand, never via CI). A tiny
        # run (no warmup, one 1s measurement, -foe so a benchmark error fails the step) proves
        # every benchmark actually launches and completes in a forked JVM. Run once, on the plain
        # spark-4.0 jdk-21 cell (the fork JVM is this cell's JDK 21; profile/hadoop/locale are
        # irrelevant to the bench module, so run it once on the baseline cell).
        if: matrix.jdk == '21' && matrix.spark-profile == 'spark-4.0' && matrix.hadoop == '3.4.1' && matrix.locale != 'de_DE'
        run: |
          java -jar cached-fs-bench/target/benchmarks.jar PrefetchMultiplierBenchmark \
            -foe true -f 1 -wi 0 -i 1 -r 1 \
            -p multiplier=4 -p latencyMicros=0 -p pattern=SEQUENTIAL
          java -jar cached-fs-bench/target/benchmarks.jar AdmissionGateBenchmark \
            -foe true -f 1 -wi 0 -i 1 -r 1 -p budgetMiB=64
      - name: Upload coverage
        # Upload only from the production-pinned hadoop-3.4.1 cells, and not the de_DE cell:
        # otherwise the hadoop-3.5.0 / de_DE cells would reuse the jdk21/spark-4.0 artifact name and
        # upload-artifact rejects duplicate names within a run.
        if: matrix.jdk == '21' && matrix.hadoop == '3.4.1' && matrix.locale != 'de_DE'
        uses: actions/upload-artifact@v7
        with:
          # Two JDK 21 / hadoop-3.4.1 cells exist (spark-4.0 and spark-4.1), so include the profile
          # in the artifact name so the second upload doesn't collide with the first.
          name: jacoco-report-jdk${{ matrix.jdk }}-${{ matrix.spark-profile }}
          path: '**/target/site/jacoco/'
