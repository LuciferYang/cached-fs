name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default Hadoop pin (3.4.1) is what production runs against.
          - jdk: '21'
            hadoop: '3.4.1'
            spark-profile: 'spark-4.0'
          # Spark 4.1 must also stay green — without this cell, the spark-4.1 profile would
          # rot silently between manual verifications and any API/binary regression introduced
          # by future PRs would only surface when someone re-tests locally.
          - jdk: '21'
            hadoop: '3.4.1'
            spark-profile: 'spark-4.1'
          # JDK 25 cell intentionally absent until Spark 4.2 GA ships. JDK 24 removed
          # Subject.getSubject(AccessControlContext); JDK 25 also rejects
          # -Djava.security.manager=allow (JEP 486 finalized). Hadoop UGI — called by
          # Spark's SparkContext init via Utils.getCurrentUserName — still hits the removed
          # API, so every Suite that builds a SparkSession crashes before its first test.
          # Spark 4.2 picks up the upstream migration to Subject.current(); re-add a
          # {jdk:25, hadoop:3.5.x, spark-profile:spark-4.2} cell at that point.
    runs-on: ubuntu-latest
    name: build (jdk-${{ matrix.jdk }} hadoop-${{ matrix.hadoop }} ${{ matrix.spark-profile }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
          cache: 'maven'
      - name: Build & test
        # Spotless / google-java-format is pinned at a JDK 21-compatible version; gate the check
        # to that one matrix entry so newer JDKs (25+) don't trip on parser internals.
        run: >-
          mvn -B -ntp verify
          -P${{ matrix.spark-profile }}
          -Dhadoop.version=${{ matrix.hadoop }}
          -Dspotless.check.skip=${{ matrix.jdk != '21' }}
      - name: Upload coverage
        if: matrix.jdk == '21'
        uses: actions/upload-artifact@v4
        with:
          # Now that two JDK 21 cells exist (spark-4.0 and spark-4.1), include the profile in
          # the artifact name so the second upload doesn't collide with the first.
          name: jacoco-report-jdk${{ matrix.jdk }}-${{ matrix.spark-profile }}
          path: '**/target/site/jacoco/'
